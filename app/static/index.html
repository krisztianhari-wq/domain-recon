<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>domain-recon · sadrobot</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<header class="top">
  <span class="brand"><span class="mark"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="7" width="18" height="14" rx="4"></rect><circle cx="10" cy="14" r="1.6" fill="currentColor"></circle><circle cx="16" cy="14" r="1.6" fill="currentColor"></circle><path d="M13 7V3"></path></svg></span>SADROBOT <small>// RECON</small></span>
  <div class="status">
    <div class="langs" role="group"><button type="button" data-lang="hu">HU</button><button type="button" data-lang="en">EN</button></div>
    <button class="icon-btn" id="theme" type="button" aria-label="theme">◐</button>
  </div>
</header>

<main>
  <div>
    <p class="eyebrow" data-i18n="eyebrow">Domain-feltérképezés</p>
    <h1 data-i18n="h1">Domain-recon</h1>
    <p class="sub" data-i18n="lead">Írj be egy domaint…</p>
  </div>

  <section class="card search">
    <div class="searchbar">
      <input type="text" id="domain" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="ph_domain" placeholder="example.com">
      <button class="go" id="go" type="button" data-i18n="go">Feltérképezés</button>
    </div>
    <div class="opts">
      <div class="opt">
        <label data-i18n="o_ports">Portok</label>
        <div class="seg" id="ports" role="group">
          <button type="button" data-v="service" class="on" data-i18n="p_service">Szolgáltatás</button>
          <button type="button" data-v="common" data-i18n="p_common">Gyakori</button>
          <button type="button" data-v="full" data-i18n="p_full">Teljes</button>
          <button type="button" data-v="custom" data-i18n="p_custom">Egyedi</button>
        </div>
      </div>
      <div class="opt hide" id="customwrap">
        <label data-i18n="p_custom">Egyedi</label>
        <input type="text" id="customports" class="customports" data-i18n-ph="ph_custom" placeholder="22,80,443,8000-8100">
      </div>
      <div class="opt">
        <label data-i18n="o_intensity">Intenzitás</label>
        <div class="seg" id="intensity" role="group">
          <button type="button" data-v="polite" class="on" data-i18n="i_polite">Kíméletes</button>
          <button type="button" data-v="normal" data-i18n="i_normal">Normál</button>
          <button type="button" data-v="aggressive" data-i18n="i_aggressive">Agresszív</button>
        </div>
      </div>
      <div class="opt">
        <label data-i18n="o_extra">Egyéb</label>
        <div class="checks">
          <label class="chk"><input type="checkbox" id="ct" checked><span data-i18n="x_ct">CT-napló</span></label>
          <label class="chk"><input type="checkbox" id="wordlist"><span data-i18n="x_wordlist">Prefix-szótár</span></label>
          <label class="chk"><input type="checkbox" id="scanports" checked><span data-i18n="x_scanports">Portscan</span></label>
          <label class="chk"><input type="checkbox" id="allowprivate"><span data-i18n="x_private">Privát IP is</span></label>
        </div>
      </div>
    </div>
    <p class="note warn" data-i18n="authz">Csak engedélyezett célpontot vizsgálj.</p>
  </section>

  <section class="card prog hide" id="progcard">
    <div class="row">
      <div class="progmeta" style="flex:1">
        <span><span class="stage-chip" id="stage">–</span> · <span id="progtxt">0 / 0</span></span>
        <span id="scanmeta"></span>
      </div>
      <button class="btn danger" id="cancel" type="button" data-i18n="cancel">Megszakítás</button>
    </div>
    <div class="progbar" id="progbar"><i></i></div>
  </section>

  <section class="stats hide" id="stats"></section>

  <section class="hide" id="results">
    <div class="toolbar">
      <input type="text" id="filter" class="filter" data-i18n-ph="filter_ph" placeholder="Szűrés…">
      <div class="pills" id="livefilter" role="group">
        <button type="button" data-v="all" class="on" data-i18n="f_all">Mind</button>
        <button type="button" data-v="live" data-i18n="f_live">Élő</button>
        <button type="button" data-v="exposed" data-i18n="f_exposed">Kitett</button>
        <button type="button" data-v="dead" data-i18n="f_dead">Nem élő</button>
      </div>
      <div style="display:flex;gap:8px">
        <a class="btn" id="csv" href="#" data-i18n="col_export_csv">CSV</a>
        <a class="btn" id="json" href="#" data-i18n="col_export_json">JSON</a>
        <button class="btn" id="newscan" type="button" data-i18n="newscan">Új vizsgálat</button>
      </div>
    </div>
    <div class="list" id="hostlist"></div>
  </section>

  <section class="card">
    <h2 data-i18n="hist_title">Korábbi vizsgálatok</h2>
    <div class="hist" id="history"></div>
  </section>
</main>

<footer>
  <span data-i18n="footer_a">sadrobot · domain-recon</span>
  <span data-i18n="footer_b">Csak engedélyezett célpontra</span>
</footer>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
