name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -q -r requirements.txt
      - run: python -m compileall -q app
      - run: python -c "import app.main, app.engine, app.sources, app.enrich, app.fingerprint, app.vulncheck, app.db, app.cli, app.desktop; print('import smoke OK', app.__version__)"
      - run: python -m app.cli scan --help

  app:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        shell: bash
        run: ./build.sh
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.os }}" in
            macos*)   ditto -c -k --keepParent "dist/domain-recon.app" "out/domain-recon-${{ matrix.label }}.zip" ;;
            windows*) 7z a -tzip "out/domain-recon-${{ matrix.label }}.zip" ./dist/domain-recon >/dev/null ;;
            *)        tar -C dist -czf "out/domain-recon-${{ matrix.label }}.tar.gz" domain-recon ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: domain-recon-${{ matrix.label }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
